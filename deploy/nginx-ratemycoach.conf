# Rate My Coach — nginx reverse proxy
#
# 1. Replace YOUR_DOMAIN and adjust proxy_pass port if PORT != 5000
# 2. sudo cp deploy/nginx-ratemycoach.conf /etc/nginx/sites-available/ratemycoach
# 3. sudo ln -sf /etc/nginx/sites-available/ratemycoach /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
#
# Important: proxy ALL paths to Node (/, /api, /uploads). Do not serve dist/public
# directly or profile photos will not load.

upstream ratemycoach_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 10M;

    location / {
        proxy_pass http://ratemycoach_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# After certbot:
# sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
